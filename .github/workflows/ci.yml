name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Anti-AI-Slop Lint — 위반 시 머지 차단 (Requirement.md NFR-6, 8.4.3)
      - run: npm run lint
      - run: npm run build
