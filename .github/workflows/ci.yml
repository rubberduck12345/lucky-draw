name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Lint — CSS 기본 위생(stylelint) + 카피 검사(이모지·마케팅 보일러플레이트)
      - run: npm run lint
      - run: npm run build
